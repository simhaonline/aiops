services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: simha_dev_password
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["simha-postgres:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simha_dev
      MINIO_ROOT_PASSWORD: simha_dev_password
    ports: ["59100:9000", "59101:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["simha-minio:/data"]
volumes:
  simha-postgres:
  simha-minio:
